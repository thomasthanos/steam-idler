    <text x="25" y="229" xml:space="preserve"><tspan fill="#475569">│   │   ├── </tspan><tspan fill="#f1f5f9" font-weight="normal">client.ts</tspan></text>
    <text x="400" y="229" fill="#64748b" font-style="italic">// steamworks.js wrapper + games cache</text>
    <text x="25" y="251" xml:space="preserve"><tspan fill="#475569">│   │   ├── </tspan><tspan fill="#f1f5f9" font-weight="normal">idleManager.ts</tspan></text>

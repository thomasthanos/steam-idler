    <text x="25" y="361" xml:space="preserve"><tspan fill="#475569">├── </tspan><tspan fill="#38bdf8" font-weight="normal">preload/index.ts</tspan></text>
    <text x="400" y="361" fill="#64748b" font-style="italic">// Secure contextBridge API</text>
    <text x="25" y="383" xml:space="preserve"><tspan fill="#475569">├── </tspan><tspan fill="#10b981" font-weight="bold">renderer/</tspan></text>
    <text x="25" y="405" xml:space="preserve"><tspan fill="#475569">│   ├── </tspan><tspan fill="#10b981" font-weight="bold">components/</tspan></text>
    <text x="400" y="405" fill="#64748b" font-style="italic">// TitleBar, Sidebar, UpdateBanner, SetupScreen</text>
    <text x="25" y="427" xml:space="preserve"><tspan fill="#475569">│   ├── </tspan><tspan fill="#10b981" font-weight="bold">pages/</tspan></text>

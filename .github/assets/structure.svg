    <text x="25" y="471" xml:space="preserve"><tspan fill="#475569">│   └── </tspan><tspan fill="#ec4899" font-weight="normal">styles/global.css</tspan></text>
    <text x="25" y="493" xml:space="preserve"><tspan fill="#475569">└── </tspan><tspan fill="#eab308" font-weight="normal">shared/types.ts</tspan></text>
    <text x="400" y="493" fill="#64748b" font-style="italic">// Shared types, IPC channels &amp; default settings</text>


    <text x="25" y="185" xml:space="preserve"><tspan fill="#475569">│   ├── </tspan><tspan fill="#f1f5f9" font-weight="normal">trayIcons.ts</tspan></text>
    <text x="400" y="185" fill="#64748b" font-style="italic">// Base64 tray icon assets</text>

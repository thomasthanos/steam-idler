    <text x="449" y="264" font-size="16">🔔</text>
    <text x="475" y="264" font-size="13" font-weight="700" fill="#66c0f4">Desktop Notifications</text>
    <text x="475" y="282" font-size="11" fill="#8f98a0">Instant toast feedback with optional sound effects</text>
    <rect x="435" y="302" width="395" height="54" rx="8" fill="url(#cardBg)" stroke="#2a475e" stroke-width="1" />
    <text x="449" y="324" font-size="16">🔽</text>
    <text x="475" y="324" font-size="13" font-weight="700" fill="#66c0f4">System Tray</text>
    <text x="475" y="342" font-size="11" fill="#8f98a0">Minimize to background tray and manage idling on the fly</text>
    <rect x="435" y="362" width="395" height="54" rx="8" fill="url(#cardBg)" stroke="#2a475e" stroke-width="1" />
    <text x="449" y="384" font-size="16">🔄</text>
    <text x="475" y="384" font-size="13" font-weight="700" fill="#66c0f4">Silent Auto-Updater</text>
    <text x="475" y="402" font-size="11" fill="#8f98a0">Automatic background update flow via GitHub Releases</text>
    <rect x="435" y="422" width="395" height="54" rx="8" fill="url(#cardBg)" stroke="#2a475e" stroke-width="1" />
    <text x="449" y="444" font-size="16">📦</text>
    <text x="475" y="444" font-size="13" font-weight="700" fill="#66c0f4">App Collection</text>
    <text x="475" y="462" font-size="11" fill="#8f98a0">Browse &amp; access companion tools by Thomas Thanos</text>
    <rect x="435" y="482" width="395" height="54" rx="8" fill="url(#cardBg)" stroke="#2a475e" stroke-width="1" />
    <text x="449" y="504" font-size="16">🛡️</text>
    <text x="475" y="504" font-size="13" font-weight="700" fill="#66c0f4">100% Offline &amp; Private</text>
    <text x="475" y="522" font-size="11" fill="#8f98a0">No cloud sync, zero telemetry, local electron-store</text>


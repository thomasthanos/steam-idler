      <stop offset="0%" stop-color="#0f141c" />
      <stop offset="100%" stop-color="#172230" />
    </linearGradient>
  </defs>

  <rect width="850" height="560" rx="12" fill="url(#setBg)" stroke="#223247" stroke-width="1.5" />

  <!-- Header -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 560" width="100%">
  <defs>
    <linearGradient id="setBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171a21" />
      <stop offset="100%" stop-color="#1b2838" />
    </linearGradient>
    <linearGradient id="rowAlt" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a475e" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#2a475e" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="850" height="560" rx="12" fill="url(#setBg)" stroke="#2a475e" stroke-width="1.5" />

  <!-- Header -->
  <path d="M 0 12 Q 0 0 12 0 L 838 0 Q 850 0 850 12 L 850 48 L 0 48 Z" fill="#1b2838" />
  <circle cx="24" cy="24" r="5" fill="#66c0f4" opacity="0.8" />
  <circle cx="40" cy="24" r="5" fill="#66c0f4" opacity="0.4" />
  <circle cx="56" cy="24" r="5" fill="#66c0f4" opacity="0.2" />

  <text x="80" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#66c0f4" letter-spacing="1">APP SETTINGS &amp; CONFIGURATION</text>
  <line x1="0" y1="48" x2="850" y2="48" stroke="#2a475e" stroke-width="1"/>

  <!-- Table Header -->
  <text x="35" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8f98a0" letter-spacing="1">SETTING</text>
  <text x="320" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#8f98a0" letter-spacing="1">DESCRIPTION</text>
  <line x1="25" y1="84" x2="825" y2="84" stroke="#2a475e" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Rows -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    <text x="35" y="108" fill="#66c0f4" font-weight="600">Steam API Key</text>
    <text x="320" y="108" fill="#c7d5e0">Optional — enables full library fetching</text>
    <rect x="20" y="122" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="139" fill="#66c0f4" font-weight="600">Steam ID</text>
    <text x="320" y="139" fill="#c7d5e0">Optional — used alongside API key</text>
    <text x="35" y="170" fill="#66c0f4" font-weight="600">Custom App IDs</text>
    <text x="320" y="170" fill="#c7d5e0">Manually add game IDs not in your library</text>
    <rect x="20" y="184" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="201" fill="#66c0f4" font-weight="600">Theme</text>
    <text x="320" y="201" fill="#c7d5e0">Dark / Light / System preference</text>
    <text x="35" y="232" fill="#66c0f4" font-weight="600">Show global %</text>
    <text x="320" y="232" fill="#c7d5e0">% of players who have each achievement</text>
    <rect x="20" y="246" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="263" fill="#66c0f4" font-weight="600">Show hidden achievements</text>
    <text x="320" y="263" fill="#c7d5e0">Reveal hidden names &amp; descriptions</text>
    <text x="35" y="294" fill="#66c0f4" font-weight="600">Confirm bulk actions</text>
    <text x="320" y="294" fill="#c7d5e0">Dialog before unlock-all / lock-all</text>
    <rect x="20" y="308" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="325" fill="#66c0f4" font-weight="600">Minimize to tray</text>
    <text x="320" y="325" fill="#c7d5e0">Keep app alive on close</text>
    <text x="35" y="356" fill="#66c0f4" font-weight="600">Launch on startup</text>
    <text x="320" y="356" fill="#c7d5e0">Start automatically with Windows</text>
    <rect x="20" y="370" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="387" fill="#66c0f4" font-weight="600">Notifications</text>
    <text x="320" y="387" fill="#c7d5e0">Desktop notifications + sound toggle</text>
    <text x="35" y="418" fill="#66c0f4" font-weight="600">Auto-Idle list</text>
    <text x="320" y="418" fill="#c7d5e0">Games to idle automatically on launch</text>
    <rect x="20" y="432" width="810" height="28" rx="6" fill="url(#rowAlt)" />
    <text x="35" y="449" fill="#66c0f4" font-weight="600">Auto-Invisible when idling</text>
    <text x="320" y="449" fill="#c7d5e0">Switch status to Invisible while idling</text>
    <text x="35" y="480" fill="#66c0f4" font-weight="600">Stop idle on game launch</text>
    <text x="320" y="480" fill="#c7d5e0">Stop all idling if a real game is launched</text>

  </g>

  <!-- Footer Banner -->
  <rect x="20" y="505" width="810" height="38" rx="8" fill="#171a21" stroke="#2a475e" stroke-width="1" />
  <text x="425" y="529" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8f98a0" text-anchor="middle">
    🔒 Stored locally via <tspan fill="#66c0f4" font-family="monospace">electron-store</tspan> • Zero telemetry • 100% offline config
  </text>
</svg>